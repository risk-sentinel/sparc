name: Secret scan HDF emit (TruffleHog)

# Caller for the reusable secret-scan-hdf.yml in risk-sentinel/dev-sec-ops-baseline.
#
# NOTE: this repository has no TruffleHog gate today, so this introduces secret
# scanning here for the first time. It is verified-only, so unverified regex
# matches (every SHA-pinned action ref, for one) are not recorded. A separate
# secret-scan.yml gate to BLOCK commits is worth adding — this records, it does
# not prevent.
#
# ---- Why a clean scan still emits -------------------------------------------
#
# `hdf convert` errors on empty input, so the obvious implementation skips the
# upload when nothing is found. A clean scan is the normal case, which means a
# clean repository and a broken pipeline then leave byte-for-byte identical
# state in the bucket: nothing. Thirteen repositories sat that way until
# dev-sec-ops-baseline#21.
#
# A clean run emits a one-control HDF recording the EXECUTION — scanner,
# version, commit, mode, zero findings. It records that a scan ran; it does not
# synthesise a finding.
#
# Never runs on pull_request: a fork PR would run this with write-ish intent,
# and the evidence stream should only reflect what landed on the default branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  emit:
    uses: risk-sentinel/dev-sec-ops-baseline/.github/workflows/secret-scan-hdf.yml@949e54cbbf42fafe79903c4329c11e9146dae87d  # v0.4.0
    with:
      boundary: ${{ vars.EVIDENCE_BOUNDARY || 'sparc' }}
    secrets:
      S3_EMIT_ROLE_ARN: ${{ secrets.SPARC_EMIT_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      COMPLIANCE_S3_BUCKET: ${{ secrets.COMPLIANCE_S3_BUCKET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
