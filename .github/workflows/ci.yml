name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Least-privilege default (#545). Jobs that need more (e.g., pull-requests:
# read for paths-filter) declare their own permissions block to override.
permissions:
  contents: read

jobs:

  # ── Path filter: skip expensive jobs on workflow-only PRs ──────
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app_code: ${{ steps.filter.outputs.app_code }}
      yaml: ${{ steps.filter.outputs.yaml }}
      python: ${{ steps.filter.outputs.python }}
      api_contract: ${{ steps.filter.outputs.api_contract }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            app_code:
              - '**.rb'
              - 'Gemfile*'
              - '.github/workflows/ci.yml'
              - 'config/**'
              - 'app/**'
              - 'lib/**'
              - 'db/**'
              - 'spec/**'
              - 'bin/**'
            yaml:
              - '**.yml'
              - '**.yaml'
              - '.yamllint'
            python:
              - 'tests/api/**'
              - 'tests/ui-smoke/**'
            # #1050 — anything that can change the API surface or its three
            # contract inputs (docs page, Postman entry, pytest module). Keep
            # in sync with the api_contract rule in .github/required-checks.json;
            # validate-required-checks-sync.yml fails the PR if they drift.
            api_contract:
              - 'config/routes.rb'
              - 'app/controllers/api/**'
              - 'docs/api/**'
              - 'tests/api/**'
              - 'bin/api_inventory_check.rb'
              - 'bin/api_postman_check.rb'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ changes ]
    if: always() && (needs.changes.outputs.app_code == 'true' || github.event_name != 'pull_request')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # ── YAML lint (#788) ──────────────────────────────────────────
  # Catches raw-YAML syntax errors + duplicate keys across config, workflows,
  # compose files, and compliance data. yamllint reads YAML without rendering
  # ERB, so it flags the exact regression that shipped a broken config/*.yml
  # undetected. Style is advisory (relaxed preset); only real errors fail.
  yaml_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ changes ]
    if: always() && (needs.changes.outputs.yaml == 'true' || github.event_name != 'pull_request')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yamllint
        run: pipx install yamllint

      - name: Lint YAML (config auto-discovered from .yamllint)
        run: yamllint -f github config/ .github/ docker-compose*.yaml docs/compliance/

  # ── Python lint (#763) ────────────────────────────────────────
  # GATING ruff check over both Python test suites so lint debt can't accumulate
  # silently (36 errors had piled up undetected before #756). ruff discovers each
  # suite's committed [tool.ruff] config per-directory, so CI matches local.
  # ruff is installed as a pinned standalone tool (not `uv run`, which builds the
  # local project and tripped the uv supply-chain lint rules S8541/S8544). Keep
  # the pin in step with the suites' uv.lock ruff versions. `ruff format` is
  # intentionally NOT gated — a large one-time reformat, tracked separately.
  python_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ changes ]
    if: always() && (needs.changes.outputs.python == 'true' || github.event_name != 'pull_request')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ruff
        run: pipx install ruff==0.15.15

      - name: Lint the Python test suites
        run: ruff check --output-format github tests/api tests/ui-smoke

  # ── API contract gate (#1050) ─────────────────────────────────
  # #995 closed with all three contract axes at 0 across 285 endpoints — every
  # /api/v1 endpoint carrying a docs page, a Postman entry and a pytest module.
  # Nothing preserved that: both gate scripts existed, worked, and were run by
  # NO workflow (`grep -rn 'api_inventory_check\|api_postman_check' .github/`
  # returned nothing), so an endpoint added afterwards with none of the three
  # was caught by a script no pipeline ran.
  #
  # The scripts now EXIT NON-ZERO by default (`--report` opts out); the old
  # default printed its findings and exited 0, which reads exactly like success
  # and did mislead a reader of this repo — see the comment in
  # bin/api_inventory_check.rb.
  #
  # `bin/rails routes` boots the app but does not connect, so this job needs no
  # postgres service — verified against an unreachable DATABASE_URL.
  api_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ changes ]
    if: always() && (needs.changes.outputs.api_contract == 'true' || github.event_name != 'pull_request')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Every /api/v1 endpoint has a doc page, a Postman entry and a pytest module
        env:
          RAILS_ENV: test
          # Deliberately unreachable: `rails routes` must not need a database,
          # and pointing at one that cannot answer proves it stays that way.
          # No credential component — there is nothing to authenticate to, and a
          # user:password pair here is a hardcoded-credential finding for no
          # benefit (sonar secrets rule). Verified this still boots and still
          # never connects.
          DATABASE_URL: postgres://unused@127.0.0.1:1/unused
        run: bin/api_inventory_check.rb

      - name: The Postman collection covers the whole route surface
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://unused@127.0.0.1:1/unused
        run: bin/api_postman_check.rb

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ changes ]
    if: always() && (needs.changes.outputs.app_code == 'true' || github.event_name != 'pull_request')

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # gitleaks:allow
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: redis
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config google-chrome-stable

      # Remove the runner image's bundled chromedriver so Selenium Manager
      # fetches one matching the Chrome we just installed.
      #
      # The two drift by construction: the ubuntu-24.04 image ships
      # /usr/bin/chromedriver frozen at image-build time, while
      # `google-chrome-stable` above always pulls the LATEST Chrome, and Google
      # ships a major roughly every four weeks. Measured on run 33165766797:
      #
      #   chromedriver 151.0.7922.138  vs  chrome 152.0.7977.64
      #
      # A full major apart. chromedriver tolerates some skew, so this is a
      # warning today and a hard failure once the gap widens — the scheduled
      # kind of break this milestone keeps finding.
      #
      # Nothing pins chromedriver here (no `webdrivers` gem, nothing in CI or
      # the spec config): Selenium Manager is meant to resolve it and would,
      # except it defers to a driver already on PATH. Deleting the stale one is
      # what Selenium's own warning advises. `|| true` because a future image
      # that stops shipping it must not fail this step.
      - name: Drop the runner's stale chromedriver (Selenium Manager resolves it)
        run: |
          sudo rm -f /usr/bin/chromedriver || true
          command -v chromedriver >/dev/null \
            && echo "::warning::a chromedriver is still on PATH at $(command -v chromedriver)" \
            || echo "no chromedriver on PATH — Selenium Manager will fetch one matching Chrome"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # ── hdf-cli, so the OSCAL translation specs actually run here (#835) ──
      #
      # Without the binary, `HdfRunner` raises Errno::ENOENT and the #817
      # pipeline specs skip themselves. They report NOT RUN rather than passing
      # silently, which is honest — but it means a version-bump PR gets a green
      # CI that proves nothing about the converter, and the hdf-cli surface is
      # where our OSCAL translation contract actually lives. It has moved under
      # us three times (3.2.0 dropped hdf->oscal-poam, 3.4.0 introduced an
      # OSCAL-invalid empty prop.value, 3.4.1 added a new exit-1 path), and
      # every one was found by hand, after the bump.
      #
      # BUILT FROM SOURCE, not downloaded. #835 proposed reusing the install
      # script, which fetches a release binary — but every published hdf
      # release including 3.5.1 is built with go1.26.5, and the GO-2026-5026
      # fix line is go1.26.6. CI-1 made the same call for security.yml: a
      # download cannot clear a stdlib CVE, choosing the toolchain does. Using
      # one mechanism in both places also means one thing to reason about.
      #
      # The pins are DERIVED from the Dockerfile rather than restated here.
      # There were already three copies of the version (Dockerfile, security.yml,
      # script/dev/install-hdf.sh); a fourth is how CI-1's 3.4.1-vs-3.5.1 drift
      # happened. script/ci/hdf_pins.sh is the only thing that reads it.
      - name: Resolve hdf-cli pins from the Dockerfile
        id: hdf_pins
        run: script/ci/hdf_pins.sh --github-output

      - name: Set up Go (pinned to the hdf-cli fix line)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.hdf_pins.outputs.go_fix_line }}

      - name: Build hdf (mitre/hdf-libs CLI) from source
        env:
          HDF_LIBS_VERSION: ${{ steps.hdf_pins.outputs.hdf_libs_version }}
          XTEXT_VERSION: ${{ steps.hdf_pins.outputs.xtext_version }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${HDF_LIBS_VERSION}" \
            https://github.com/mitre/hdf-libs.git /tmp/hdf-src
          cd /tmp/hdf-src/hdf-cli
          go mod edit -require="golang.org/x/text@v${XTEXT_VERSION}"
          go mod download golang.org/x/text
          PKG="github.com/mitre/hdf-libs/hdf-cli/v3/cmd/hdf/cmd"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X ${PKG}.version=${HDF_LIBS_VERSION}" \
            -o /usr/local/bin/hdf ./cmd/hdf
          # Read the result back out of the binary rather than trusting the
          # steps above — a drifted requirement or a changed toolchain would
          # otherwise build clean and reintroduce the CVE silently.
          go version -m /usr/local/bin/hdf | grep -E "golang.org/x/text[[:space:]]+v${XTEXT_VERSION}" \
            || { echo "::error::hdf does not carry x/text v${XTEXT_VERSION}"; exit 1; }
          hdf version | grep -q "${HDF_LIBS_VERSION}" \
            || { echo "::error::hdf is not version ${HDF_LIBS_VERSION}"; exit 1; }

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ssp_tpr_manager_test  # gitleaks:allow
          COVERAGE: "1"
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bundle exec rspec

      # The point of installing hdf was that the translation specs stop
      # skipping. A build that succeeds while the specs still skip would look
      # identical to success, so assert it rather than assume it — the whole
      # subject of this milestone.
      - name: Assert the HDF translation specs were not skipped
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ssp_tpr_manager_test  # gitleaks:allow
        run: |
          set -uo pipefail
          command -v hdf >/dev/null || { echo "::error::hdf is not on PATH in the test job"; exit 1; }
          out=$(bundle exec rspec spec/integration/oscal_e2e_pipeline_spec.rb 2>&1) || {
            echo "$out" | tail -30; echo "::error::HDF pipeline specs failed"; exit 1; }
          echo "$out" | tail -5
          if echo "$out" | grep -q "hdf-cli not on PATH"; then
            echo "::error::the HDF pipeline specs skipped for a missing binary even though hdf is installed"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 90

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
