  admin/users:
    mapped:
      index: ["GET /api/v1/users"]
      show: ["GET /api/v1/users/:id"]
      create: ["POST /api/v1/users"]
      suspend: ["PATCH /api/v1/users/:id"]
      deactivate: ["DELETE /api/v1/users/:id"]
      reset_password: ["POST /api/v1/users/:id/password_reset"]
      email_password_reset: ["POST /api/v1/users/:id/password_reset?mode=email"]
    ui_only:
      - reason: "HTML form pages; the API takes the same fields as a JSON body"
        actions: [new, edit]
    gap:
      update:
        reason: "API PATCH edits names/email/admin/status but cannot set instance role_ids or boundary role assignments, which the web edit form syncs"
        would_be: "PATCH /api/v1/users/:id"
        partial: true
      reactivate:
        reason: "API can set status=active but cannot force a password reset on reactivation, and does not clear deleted_at/inactive_reason as User#reactivate! does"
        would_be: "POST /api/v1/users/:id/reactivate"
      reset_security_keys:
        reason: "Admin lockout recovery (revoke all of a user's FIDO2 keys) is browser-only"
        would_be: "DELETE /api/v1/users/:id/webauthn_credentials"

