        partial: true
      associate_source:
        reason: "API PATCH sets source ids but does not rebuild controls/objectives or copy back-matter from the linked profile/SSP"
        would_be: "PATCH /api/v1/sap_documents/:id/associate_source"
      update_objective:
        reason: "per-objective status/assessor/notes are not writable via API"
        would_be: "PATCH /api/v1/sap_documents/:sap_document_id/objectives/:id"
      publish:
        reason: "API PATCH lifecycle_status bypasses publication validation, approval gate, version bump and published timestamp"
        would_be: "POST /api/v1/sap_documents/:id/publish"
      publish_check:
        reason: "publication readiness report is browser-only"
        would_be: "GET /api/v1/sap_documents/:id/publish_check"

