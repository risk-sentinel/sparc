    ui_only:
      - reason: "HTML form pages; the API takes the same fields as a JSON body"
        actions: [new, edit]
    gap:
      create:
        reason: "linking an item to risks/observations/findings (poam_risk_ids etc.) is not writable via API"
        would_be: "POST /api/v1/poam_documents/:poam_document_id/items"
        partial: true
      update:
        reason: "re-linking an item to risks/observations/findings (poam_risk_ids etc.) is not writable via API"
        would_be: "PATCH /api/v1/poam_documents/:poam_document_id/items/:id"
        partial: true

