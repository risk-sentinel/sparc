# Web <-> API parity register — enforced by spec/requests/web_api_parity_spec.rb.
#
# Every NON-API route (not under /api/) is accounted for here, per controller, as:
#
#   mapped:   { action: ["VERB /api/v1/..."] }   the Api::V1 route(s) that perform the
#             same function. The spec fails if a named API route does not exist. A
#             `?query` suffix documents the variant; existence is checked on the path.
#   ui_only:  [{ reason:, actions: [...] }]      browser-only mechanisms with no separate
#             user-facing function (form pages, pickers, sign-in flows...).
#   gap:      { action: { reason:, would_be:, partial:, issue: } }
#             a user-facing function with NO (or only a partial) API equivalent. `would_be`
#             is the API route it needs; when that route appears the spec fails and tells
#             you to promote the entry to `mapped`. A `?query` would_be on an existing path
#             is probed against the API. `partial: true` means the route EXISTS but falls
#             short (unpermitted fields, skipped side effects): never auto-promoted, only
#             checked to still name a real route. The gap list is REVIEWED, not a waiver.
#
# An action reachable by several web paths that classify differently is keyed per path:
# `action@VERB /path` (the path exactly as `bin/rails routes` prints it, minus (.:format)).
#
# `ignored` lists framework-owned routes that are not SPARC functions at all.
ignored:
  controllers:
    - prefix: "rails/"
      reason: "Rails framework routes (Action Mailbox conductor, info); not SPARC functions"
    - prefix: "active_storage/"
      reason: "Active Storage blob/representation plumbing behind uploaded files"
    - prefix: "action_mailbox/"
      reason: "Action Mailbox ingress endpoints; not SPARC functions"
    - prefix: "turbo/native/navigation"
      reason: "turbo-rails native-app navigation helpers"
  paths:
    - path: "/cable"
      reason: "Action Cable websocket mount (Turbo Streams transport)"
    - path: "/help/trust-store"
      reason: "redirect to a help page; not a function"

controllers:
  # ==== SSP / SAP / SAR / POA&M documents and POA&M sub-resources
  ssp_documents:
    mapped:
      index: ["GET /api/v1/ssp_documents"]
      show: ["GET /api/v1/ssp_documents/:id", "GET /api/v1/ssp_documents/:id/export", "GET /api/v1/ssp_documents/:ssp_document_id/statements", "GET /api/v1/ssp_documents/:ssp_document_id/components"]
      destroy: ["DELETE /api/v1/ssp_documents/:id"]
      update: ["PUT /api/v1/ssp_documents/:id/update_fields"]
      download_json: ["GET /api/v1/ssp_documents/:id/export"]
      attach_boundary: ["PATCH /api/v1/ssp_documents/:id"]
      set_baseline: ["PATCH /api/v1/ssp_documents/:id"]
      populate_from_profile: ["POST /api/v1/ssp_documents/:id/populate_from_profile"]
      create_from_profile: ["POST /api/v1/ssp_documents", "POST /api/v1/ssp_documents/:id/populate_from_profile"]
      declare_role: ["POST /api/v1/ssp_documents/:ssp_document_id/roles"]
      import_back_matter: ["GET /api/v1/back_matter_resources/:id", "POST /api/v1/back_matter_resources"]
      create_control_resource: ["POST /api/v1/back_matter_resources", "POST /api/v1/back_matter_resources/:id/link"]
      link_control_resource: ["POST /api/v1/back_matter_resources/:id/link"]
      unlink_control_resource: ["DELETE /api/v1/back_matter_resources/:id/unlink"]
      validate_oscal_export: ["GET /api/v1/ssp_documents/:id/export?format=oscal"]  # #1181 / #1154 part 2 — promoted from gap
      download_oscal: ["GET /api/v1/ssp_documents/:id/export?format=oscal"]  # #1181 / #1154 part 2 — promoted from gap
      download_oscal_validated: ["GET /api/v1/ssp_documents/:id/export?format=oscal"]  # #1181 / #1154 part 2 — promoted from gap
      download_oscal_unvalidated: ["GET /api/v1/ssp_documents/:id/export?format=oscal&validate=false"]  # #1181 / #1154 part 2 — promoted from gap
      download_xml: ["GET /api/v1/ssp_documents/:id/export?format=oscal-xml"]  # #1181 / #1154 part 2 — promoted from gap
      download_yaml: ["GET /api/v1/ssp_documents/:id/export?format=oscal-yaml"]  # #1181 / #1154 part 2 — promoted from gap
    ui_only:
      - reason: "HTML form pages; the API takes the same fields as a JSON body"
        actions: [new, enrich]
      - reason: "dead route: edit action has no template (views/ssp_documents/edit.html.erb absent)"
        actions: [edit]
      - reason: "pickers/wizard steps that only render choices (published profiles, CDEFs)"
        actions: [select_profile, wizard, attach_profile]
      - reason: "dead route: no import_json action or template exists in the controller"
        actions: [import_json]
    gap:
      create:
        reason: "browser upload ingests OSCAL JSON/XML/YAML SSPs; API has only Excel convert and metadata-only create"
        would_be: "POST /api/v1/ssp_documents/import"
      create_from_wizard:
        reason: "wizard builds SSP with selected CDEF components, CDEF auto-fill and boundary description; API create+populate cannot attach CDEFs"
        would_be: "POST /api/v1/ssp_documents/generate"
      status:
        reason: "conversion error_message of a failed import is not exposed by API show"
        would_be: "GET /api/v1/ssp_documents/:id"
        partial: true
      update_metadata:
        reason: "OSCAL metadata (parties, responsible-parties, revisions, locations, props, links, remarks) and oscal_version are not writable via API"
        would_be: "PATCH /api/v1/ssp_documents/:id"
        partial: true
      update_enrich:
        reason: "system_id, system_name_short, date_authorized, boundary/network/data-flow descriptions, information types and system users are not writable via API"
        would_be: "PATCH /api/v1/ssp_documents/:id"
        partial: true
      update_statement:
        reason: "API statement update does not mark an inherited statement overridden, so the next CDEF refresh reverts the edit"
        would_be: "PATCH /api/v1/ssp_control_statements/:id"
        partial: true
      refresh_inherited_statements:
        reason: "bulk resync of inherited prose from linked CDEFs is browser-only"
        would_be: "POST /api/v1/ssp_documents/:id/refresh_inherited_statements"
      reset_inherited_statement:
        reason: "dropping a statement override and resyncing to source is browser-only"
        would_be: "POST /api/v1/ssp_control_statements/:id/reset_to_source"
      import_boundary_users:
        reason: "SSP system users have no API; importing boundary members as users is browser-only"
        would_be: "POST /api/v1/ssp_documents/:id/import_boundary_users"
      import_cdef_components:
        reason: "API component create cannot set cdef_document_id, so a CDEF-linked component cannot be created"
        would_be: "POST /api/v1/ssp_documents/:id/import_cdef_components"
      publish:
        reason: "API PATCH lifecycle_status bypasses publication validation, approval gate, version bump and published timestamp"
        would_be: "POST /api/v1/ssp_documents/:id/publish"
      publish_check:
        reason: "publication readiness report is browser-only"
        would_be: "GET /api/v1/ssp_documents/:id/publish_check"

  sar_documents:
    mapped:
