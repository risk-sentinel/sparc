      download_oscal_validated: ["GET /api/v1/sar_documents/:id/export?format=oscal"]  # #1181 / #1154 part 2 — promoted from gap
      download_oscal_unvalidated: ["GET /api/v1/sar_documents/:id/export?format=oscal&validate=false"]  # #1181 / #1154 part 2 — promoted from gap
      download_xml: ["GET /api/v1/sar_documents/:id/export?format=oscal-xml"]  # #1181 / #1154 part 2 — promoted from gap
      download_yaml: ["GET /api/v1/sar_documents/:id/export?format=oscal-yaml"]  # #1181 / #1154 part 2 — promoted from gap
    ui_only:
      - reason: "HTML form pages; the API takes the same fields as a JSON body"
        actions: [new, enrich, edit_control]
      - reason: "pickers/wizard steps that only render choices (SAPs, profiles, SSPs)"
        actions: [wizard, select_profile, select_ssp]
      - reason: "dead route: no editor action or template exists in the controller"
        actions: [editor]
      - reason: "dead route: no edit action or template exists in the controller"
        actions: [edit]
      - reason: "dead route: no import_json action or template exists in the controller"
        actions: [import_json]
    gap:
      create:
        reason: "browser upload ingests OSCAL JSON/XML/YAML SARs; API convert accepts Excel only"
        would_be: "POST /api/v1/sar_documents/import"
      create_from_wizard:
        reason: "generating a populated SAR from a SAP is browser-only"
        would_be: "POST /api/v1/sar_documents/generate"
      create_from_profile:
        reason: "generating a populated SAR from a published profile is browser-only"
        would_be: "POST /api/v1/sar_documents/generate"
      create_from_ssp:
        reason: "generating a populated SAR from an SSP is browser-only"
        would_be: "POST /api/v1/sar_documents/generate"
      status:
        reason: "conversion error_message of a failed import is not exposed by API show"
        would_be: "GET /api/v1/sar_documents/:id"
        partial: true
      update_metadata:
        reason: "OSCAL metadata (parties, responsible-parties, revisions, locations, props, links, remarks), sar_version and oscal_version are not writable via API"
        would_be: "PATCH /api/v1/sar_documents/:id"
        partial: true
      update_enrich:
        reason: "SAR results, observations and findings (and import_ap_href/assessment dates) have no API; only risks do"
        would_be: "POST /api/v1/sar_documents/:sar_document_id/results"
      associate_source:
        reason: "API PATCH sets source ids but does not backfill objectives or copy back-matter from the linked sources"
        would_be: "PATCH /api/v1/sar_documents/:id/associate_source"
      update_objective:
        reason: "per-objective assessment status/assessor/notes are not writable via API"
        would_be: "PATCH /api/v1/sar_documents/:sar_document_id/objectives/:id"
      download_excel:
        reason: "SAR Excel export is browser-only"
        would_be: "GET /api/v1/sar_documents/:id/export?format=excel"
      publish:
        reason: "API PATCH lifecycle_status bypasses publication validation, approval gate, version bump and published timestamp"
        would_be: "POST /api/v1/sar_documents/:id/publish"
      publish_check:
        reason: "publication readiness report is browser-only"
        would_be: "GET /api/v1/sar_documents/:id/publish_check"

  sap_documents:
    mapped:
      index: ["GET /api/v1/sap_documents"]
      show: ["GET /api/v1/sap_documents/:id", "GET /api/v1/sap_documents/:id/export"]
      create: ["POST /api/v1/sap_documents/import", "POST /api/v1/sap_documents/generate"]
      destroy: ["DELETE /api/v1/sap_documents/:id"]
      download_json: ["GET /api/v1/sap_documents/:id/export"]
      attach_boundary: ["PATCH /api/v1/sap_documents/:id"]
