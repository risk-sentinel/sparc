    gap:
      update:
        reason: "per-control assessment_method/assessment_status/assessor_name/objective/test_case are sap_controls columns; API field import writes only control fields"
        would_be: "PATCH /api/v1/sap_documents/:sap_document_id/controls/:id"
      status:
        reason: "conversion error_message of a failed import is not exposed by API show"
        would_be: "GET /api/v1/sap_documents/:id"
        partial: true
      update_metadata:
        reason: "OSCAL metadata (parties, responsible-parties, revisions, locations, props, links, remarks) and oscal_version are not writable via API"
