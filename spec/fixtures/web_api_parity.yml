      create: ["POST /api/v1/poam_documents", "POST /api/v1/poam_documents/import"]
      update: ["PATCH /api/v1/poam_documents/:poam_document_id/items/:id"]
      destroy: ["DELETE /api/v1/poam_documents/:id"]
      attach_boundary: ["PATCH /api/v1/poam_documents/:id"]
      set_baseline: ["PATCH /api/v1/poam_documents/:id"]
      validate_oscal_export: ["GET /api/v1/poam_documents/:id/export?format=oscal"]  # #1181 / #1154 part 2 — promoted from gap
      download_oscal: ["GET /api/v1/poam_documents/:id/export?format=oscal"]  # #1181 / #1154 part 2 — promoted from gap
      download_oscal_validated: ["GET /api/v1/poam_documents/:id/export?format=oscal"]  # #1181 / #1154 part 2 — promoted from gap
      download_oscal_unvalidated: ["GET /api/v1/poam_documents/:id/export?format=oscal&validate=false"]  # #1181 / #1154 part 2 — promoted from gap
      download_xml: ["GET /api/v1/poam_documents/:id/export?format=oscal-xml"]  # #1181 / #1154 part 2 — promoted from gap
      download_yaml: ["GET /api/v1/poam_documents/:id/export?format=oscal-yaml"]  # #1181 / #1154 part 2 — promoted from gap
      download_json: ["GET /api/v1/poam_documents/:id/export"]  # #1181 / #1154 part 2 — promoted from gap
    ui_only:
      - reason: "HTML form page; the API takes the same fields as a JSON body"
