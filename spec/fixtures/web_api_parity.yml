      validate_oscal_export: ["GET /api/v1/sap_documents/:id/export?format=oscal"]  # #1181 / #1154 part 2 — promoted from gap
      download_oscal: ["GET /api/v1/sap_documents/:id/export?format=oscal"]  # #1181 / #1154 part 2 — promoted from gap
      download_oscal_validated: ["GET /api/v1/sap_documents/:id/export?format=oscal"]  # #1181 / #1154 part 2 — promoted from gap
      download_oscal_unvalidated: ["GET /api/v1/sap_documents/:id/export?format=oscal&validate=false"]  # #1181 / #1154 part 2 — promoted from gap
      download_xml: ["GET /api/v1/sap_documents/:id/export?format=oscal-xml"]  # #1181 / #1154 part 2 — promoted from gap
      download_yaml: ["GET /api/v1/sap_documents/:id/export?format=oscal-yaml"]  # #1181 / #1154 part 2 — promoted from gap
    ui_only:
      - reason: "HTML form page; the API takes the same fields as a JSON body"
        actions: [new]
      - reason: "dead route: edit action has no template (views/sap_documents/edit.html.erb absent)"
        actions: [edit]
      - reason: "dead route: no import_json action or template exists in the controller"
