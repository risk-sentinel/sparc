# The default local stack: `docker compose up -d`.
#
# #966 — this used to build a SECOND BASE OS (Dockerfile_debian) purely to make
# development fast. That is now unnecessary and was never free:
#
#   * It cost us #750. Debian's implicit LANG=C.UTF-8 masked UBI9's missing
#     locale, which 500'd every page in production. A different base for
#     development is how a prod-only bug stays hidden until prod.
#   * Nothing in CI ever built it, so it was unverified by construction.
#   * It carried 7 of the 34 open SonarCloud vulnerabilities, for an image
#     nobody ships.
#
# Measured before removing it: on the UBI9 image with the source bind-mounted,
# an edit is visible in the container instantly and served 12s after
# `docker compose restart web` — against 2-5 minutes for a rebuild. Same image
# production ships.
#
# ── WHAT CHANGED FOR YOU ──────────────────────────────────────────────────
#
# `RAILS_ENV=development` INSIDE THE CONTAINER IS GONE. It cannot be offered on
# the production runtime image: that stage carries no compiler and no package
# manager (verified — no gcc, make, apt-get, microdnf or dnf), so the old
# runtime `apt-get install build-essential && bundle install` is impossible
# there, and adding a toolchain would stop it being the artifact we ship.
#
# For true development mode with hot reloading, run Rails on the HOST
# (`bin/rails server`) against this stack's Postgres and Redis — which is
# already where the test suite runs. For anything that must exercise the
# shipped artifact, this stack is now that artifact.
#
# ── ARCHITECTURE ──────────────────────────────────────────────────────────
#
# `platform: ""` clears the amd64 pin that docker-compose.ubi9.yaml sets. That
# pin reproduces the deployed posture (Fargate defaults to X86_64) and belongs
# to the RELEASE GATE, not to local development, where it means QEMU emulation.
# Run the gate stack explicitly when you need that posture:
#
#   docker compose -f docker-compose.ubi9.yaml up -d --build
#
# SAME PROJECT NAME as the gate stack, deliberately. `include:` does not inherit
# it, and without this the default file resolves to project `sparc` while the
# gate resolves to `sparc-ubi9` — two projects building the SAME Dockerfile into
# two differently-named images, so no build cache is shared and a second ~700MB
# copy lands on disk. One project, one image, one set of containers.
name: sparc-ubi9

include:
  - docker-compose.ubi9.yaml
  - compose.dev.yaml

services:
  web:
    # `!reset` REMOVES the value from the merged config. `platform: ""` does not
    # — it is ignored, the base file's amd64 pin wins, and the stack runs under
    # QEMU on Apple Silicon. Measured: `uname -m` reported x86_64 on an arm64
    # host, and the build crawled.
    platform: !reset null
