# Local-validation override: build and run the UBI9 prod image NATIVELY.
#
# `docker-compose.ubi9.yaml` pins `platform: linux/amd64` because that is what
# ships. On an arm64 workstation that runs the whole build under QEMU, which is
# slow enough to matter — a Rails image compiling native gems under emulation is
# a long build, and it exhausted the Docker VM outright on 2026-09-13, taking the
# daemon down at container-start after ~44 completed steps.
#
# `!reset null` REMOVES the key rather than setting it to an empty string.
# `platform: ""` is silently ignored by compose and the stack still runs under
# emulation — measured, and the reason this file uses the reset form.
#
# ── What this does and does not prove ───────────────────────────────────────
#
# The pre-PR gate is that a UBI9 prod image is BUILT LOCALLY FROM THE BRANCH CODE
# and TESTED before the PR opens. The disqualifier is STALENESS — an image that
# does not match the commit under test, which is why `docker cp`-ing source into
# a running container never satisfies it. Architecture is not the disqualifier:
# the same Dockerfile, the same layers, the same application code.
#
# What an arm64 run does NOT cover is an arch-specific defect — a native gem that
# behaves differently on x86_64, or a base-image package that differs by arch.
# CI builds and scans amd64, so that remains covered there; this file is for the
# local loop only.
#
# Usage:
#   docker compose -f docker-compose.ubi9.yaml -f dev/ubi9/compose.arm64.yaml \
#     up --build -d
#
# Say so in the PR test plan when the local gate ran this way, rather than
# letting "UBI9 image built and tested" imply the shipping architecture.
services:
  web:
    platform: !reset null
