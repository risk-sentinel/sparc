- cve_id: CVE-2026-53613
  package: libblkid/libmount/libsmartcols/libuuid
  installed_version: 2.37.4-25.el9
  fixed_version: none
  severity: HIGH
  disposition: false_positive
  rationale: 'NOT APPLICABLE (vulnerable program absent) — first dispositioned 2026-08-20 (#1001). util-linux
    TOCTOU in mount(8): with an /etc/fstab entry carrying the `user`/`users` option, mount validates the
    target before the syscall, and a local unprivileged user with write access to an ancestor of the target
    can swap it to redirect the mount. MEASURED in the shipping image, not argued: `command -v mount`
    finds no mount(8), there is no /etc/fstab at all, and the runtime user is uid=1000(rails) non-root.
    Only the shared libraries from the util-linux source package are present, pulled in as dependencies;
    the vulnerable executable is not in the image. No fix is available upstream, so this would otherwise
    defer indefinitely against a program we do not ship.'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-08-20'
  next_review_date: '2026-10-19'
- cve_id: CVE-2026-14456
  package: openssl-libs
  installed_version: 1:3.5.5-6.el9_8
  fixed_version: none
  severity: HIGH
  disposition: false_positive
  rationale: 'NOT APPLICABLE (feature not used) — first dispositioned 2026-08-20 (#1001). Unbounded channel
    allocation in an OpenSSL QUIC server (Listener SSL object) processing Initial packets for unknown
    destination connection IDs, giving a remote memory-exhaustion DoS. SPARC runs no QUIC listener: the
    application is Puma serving HTTP/1.1 over TCP, TLS terminates ahead of it (ALB in production, caddy
    locally), and nothing in the image opens a QUIC socket. The library is linked for TLS and X.509, and
    the QUIC server path is never entered. No upstream fix exists.'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-08-20'
  next_review_date: '2026-10-19'
