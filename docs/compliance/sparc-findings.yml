- cve_id: CVE-2026-114406
  package: ca-certificates
  installed_version: 2025.2.80_v9.0.305-102.el10_1
  fixed_version: none available upstream (not-fixed)
  severity: CRITICAL
  disposition: deferred
  rationale: 'ca-certificates trusts root CAs that signed intermediate CA certificates with weak private keys issued by the eMudhra authority, so a holder of one of those keys could present a certificate for any host name that a client using the system store would trust (Red Hat RHSB-2026-012; Red Hat rates it Critical, NVD 6.8 Medium, CVSS 3.1 AV:N/AC:H/PR:N/UI:R/C:H/I:H/A:N). PRESENT IN THE UBI 10 IMAGE (RHEL 10.2) as ca-certificates 2025.2.80_v9.0.305-102.el10_1, the base package of digest 552f8cc1; the UBI 10 repositories offered no newer build on 2026-10-22. First reported by the grype-container gate on 2026-10-22 (grype 0.115.0), on main and every open PR alike. Red Hat''s remedy is to remove the roots that signed the weak intermediates; until it ships, the image applies that remedy itself (Dockerfile, config/ca-trust/blocklist/). The package stays flagged by version, so the finding stays open in the POA&M until Red Hat ships the fix and the blocklist is removed. Proposed 2026-10-22 and approved for the register by the owner in conversation; the risk adjustment below awaits the owner''s /approve-deviation.'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-10-22'
  next_review_date: '2026-11-21'
  deviation:
    type: risk_adjustment
    risk_status: deviation-requested
    adjusted_severity: LOW
    adjustment_rationale: 'CRITICAL grades a system store that still trusts the roots behind the weak eMudhra intermediates. The mitigating factors below are properties of THIS image, measured rather than argued: the one such root that is a TLS anchor in the UBI 10 store is distrusted at build, and the build fails if it is still trusted. What remains is the package version the scanner matches, until Red Hat ships the fix.'
    mitigating_factors:
    - description: "emSign ECC Root CA - G3 (SHA-256 86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b) is placed in /etc/pki/ca-trust/source/blocklist and update-ca-trust removes it from /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem; the Dockerfile fails the build if it is still there"
    - description: "the other root Red Hat names, Comodo AAA Certificate Services, is not a TLS trust anchor in the UBI 10 store: it is absent from tls-ca-bundle.pem in the base image"
    - description: "every outbound TLS client in the app uses OpenSSL's default store (SparcHttp, Net::HTTP, the AWS SDK without its bundled certificate, the LDAP client's default store), which is /etc/pki/tls/cert.pem -> tls-ca-bundle.pem plus /etc/pki/tls/certs; no gem the app uses ships its own CA bundle. Measured on the built image: OpenSSL::X509::Store#set_default_paths refuses the emSign ECC Root CA - G3 certificate while a root still in the bundle verifies. The only other copies are the package's untouched trust source and p11-kit's openssl-format extract, which no default path reads"
    kev_checked: '2026-10-22'
    kev_listed: false
- cve_id: CVE-2026-75804
  package: openssl-libs
  installed_version: 1:3.5.8-2.el10_2
  fixed_version: none available upstream (not-fixed)
  severity: HIGH
  disposition: deferred
  rationale: 'OpenSSL: QUIC connection-level flow control is not enforced, allowing a remote peer to force excess buffering (DoS). PRESENT IN THE UBI 10 IMAGE (RHEL 10.2): openssl-libs 1:3.5.8-1.el10_2, and still present at 1:3.5.8-2.el10_2 after the v1.17.1 base bump (rescan 2026-10-16), and equally in the shipping v1.16.3 UBI9 image (1:3.5.8-1.el9_8), so not introduced by the base change. Red Hat lists it affected with no fix (not-fixed) on el9 and el10. Surfaced by the grype-container gate made live in #1200 (grype 0.115.0, DB built 2026-09-30T06:32Z); Trivy does not report it. openssl-libs cannot be stripped: Ruby''s OpenSSL bindings and every outbound TLS client need it. Proposed 2026-09-30 and approved for the register by the owner in conversation; the risk adjustment below awaits the owner''s /approve-deviation. Separate from the OpenSSL copy the pg gem bundles, tracked in #1204.'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-09-30'
  next_review_date: '2026-10-30'
  deviation:
    type: risk_adjustment
    risk_status: deviation-approved
    approved_by: "@clem-field"
    approved_in: "risk-sentinel/sparc#1201"
    approved_at: "2026-10-01"
    approval_mechanism: approve-deviation-comment
    adjusted_severity: LOW
    adjustment_rationale: 'HIGH grades the flaw where the affected protocol is in use. The mitigating factors below are properties of THIS image, measured rather than argued. No upstream fix exists, so the residual is what is being accepted until Red Hat ships one.'
    mitigating_factors:
    - description: "the flaw is in OpenSSL's QUIC stack; Ruby's OpenSSL extension exposes no QUIC API (no QUIC constants in OpenSSL::SSL, no stream methods on SSLSocket), and no gem in the bundle implements QUIC"
    - description: "SPARC serves HTTP/1.1 through Puma behind the deployment's TLS terminator; the image runs no QUIC or HTTP/3 endpoint and makes no QUIC connections"
    kev_checked: '2026-09-30'
    kev_listed: false
