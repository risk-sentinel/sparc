  # ==========================================================================
  # 2026-07-29 delta block (#862) -- SQLite use-after-free cluster
  #
  # Six UAF CVEs published 2026-07-27 against sqlite-libs, all fix_state
  # "not-fixed": Red Hat lists RHEL 9 (and Red Hat Hardened Images) as
  # Affected with no erratum and no patched package available.
  #
  # Reachability, verified against the shipped v1.15.3 image on 2026-07-29:
  #   - SPARC has NO sqlite3 gem -- Gemfile and Gemfile.lock contain no SQLite
  #     dependency at all. The ActiveRecord/Solid Cache SQLite files in the
  #     image are unused adapter code and generator templates.
  #   - /usr/local/bin/ruby is NOT linked against libsqlite3 (ldd), so the
  #     application process cannot reach the vulnerable parser.
  #   - `rpm -q --whatrequires sqlite-libs` reports no dependent package.
  #     The only binaries linking libsqlite3.so.0 are gpg/gpg2 and the
  #     rpm/microdnf family, which back the RPM database (rpmdb.sqlite).
  #     These are package-management tools, not invoked on the request path.
  #   - SPARC's data path is PostgreSQL. All four parser-reachable CVEs
  #     require the attacker to supply SQL or JSON to a SQLite parser; no
  #     such parser is exposed to untrusted input.
  #
  # Disposition is `accepted`, not `false_positive`: the affected package is
  # genuinely present at the affected version and the flaws are real. What is
  # absent is a reachable path, not the vulnerability. sqlite-libs cannot be
  # removed from the image because rpm itself depends on it.
  #
  # Detection note (#862): grype reports these when scanning the IMAGE but not
  # when scanning the Trivy CycloneDX SBOM that grype_sbom_scan actually gates
  # on; Trivy does not report them at all (its RHEL source is advisory-driven
  # and Red Hat has shipped no erratum). Dispositioned here proactively so the
  # gate does not break the moment either data source catches up.
  # ==========================================================================

  - cve_id: CVE-2026-51302
    package: sqlite-libs
    installed_version: "3.34.1-9.el9_7"
    fixed_version: "none (Red Hat: Affected, no erratum)"
    severity: CRITICAL
    disposition: deferred
    rationale: "FALSE POSITIVE (not reachable). Use-after-free in SQLite expression evaluation (sqlite3ReleaseTempReg / exprComputeOperands); Red Hat rates this Critical, CVSS 10.0. Exploitation requires supplying a malicious SQL statement to a SQLite parser, and SPARC exposes none: there is no sqlite3 gem in the Gemfile, /usr/local/bin/ruby is not linked against libsqlite3 (verified by ldd on the v1.15.3 image), no package in the image requires sqlite-libs, and the only binaries linking it are gpg/gpg2 and the rpm/microdnf family backing the RPM database. SPARC's data path is PostgreSQL. Same substantive basis as the unreachable-library precedent set by CVE-2026-41989 (libgcrypt20). NOTE ON DISPOSITION: the HIGH and MEDIUM members of this cluster are dispositioned `accepted` on identical reasoning; this entry uses `false_positive` because the #244 policy forbids `accepted` for CRITICAL and `deferred` would breach the zero-tolerance critical threshold. The classification difference is a policy artifact, not a difference in assessment — and because false_positive is exempt from the automated review cadence, this entry must be revisited by hand when Red Hat ships the erratum. Tracked in #862."
    nist_control: si-2
    reviewed_by: "@clem-field"
    discovery_date: "2026-07-29"
    next_review_date: "2026-08-28"
    deviation:
      type: risk_adjustment
      risk_status: deviation-approved
      adjusted_severity: LOW
      mitigating_factors:
