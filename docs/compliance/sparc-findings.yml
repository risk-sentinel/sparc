- cve_id: rb/csrf-protection-disabled
  package: sparc (application code — CodeQL rb/csrf-protection-disabled)
  installed_version: n/a
  fixed_version: n/a
  severity: HIGH
  disposition: false_positive
  rationale: 'NOT A VULNERABILITY IN THESE THREE PLACES — each skip of Rails forgery protection is deliberate,
    documented at the site, and covered by a different control. (1) api/v1/sessions_controller.rb — the
    only credential this endpoint accepts is a Bearer token, which a cross-origin page cannot make a browser
    attach; there is no cookie session to forge a request with. The controller has exactly one action, with
    a note to scope the skip if a second is added. (2) omniauth_callbacks_controller.rb — the OAuth/OIDC
    `state` parameter IS the forgery protection for an IdP callback, validated by OmniAuth before the action
    runs; scoped `only: :create`. (3) security/csp_reports_controller.rb — a write-only, unauthenticated CSP
    report beacon that browsers POST without a token; it changes no state, is Rack::Attack rate-limited and
    reads at most 8 KB. CodeQL declares the rule at CVSS 8.8, which is the grading for a skip on a
    cookie-authenticated state-changing endpoint; none of these is one. Pinned to the three results; any
    new skip breaches the gate (#1186).'
  nist_control: sc-23
  reviewed_by: '@clem-field'
  discovery_date: '2026-09-24'
  next_review_date: '2026-10-24'
  pinned_results:
  - path: app/controllers/api/v1/sessions_controller.rb
    line_hash: bcb8fce034920d18:1
  - path: app/controllers/omniauth_callbacks_controller.rb
    line_hash: 65a80ff508f87093:1
  - path: app/controllers/security/csp_reports_controller.rb
    line_hash: 70c0ede27ea6218:1
- cve_id: rb/clear-text-storage-sensitive-data
  package: sparc (application code — CodeQL rb/clear-text-storage-sensitive-data)
