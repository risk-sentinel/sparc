  - cve_id: GO-2026-5005
    package: golang.org/x/crypto
    installed_version: "0.46.0"
    fixed_version: "0.52.0"
    severity: CRITICAL
    disposition: remediated
    rationale: "REMEDIATED (#639 — thruster gem removed; the Go binary is no longer in the image, so this finding no longer appears in the scan). FALSE POSITIVE (unreachable). CVE-2026-39833 — invoking key constraints are not enforced in golang.org/x/crypto/ssh/agent. Flagged because the thruster 0.1.21 Go reverse-proxy binary (gem \"thruster\", in front of Puma) embeds golang.org/x/crypto v0.46.0, but thruster imports x/crypto only for ACME/autocert TLS — NOT the ssh/ssh-agent/knownhosts subpackages. SPARC runs no SSH client, server, or agent through thruster or anywhere in the app; the vulnerable golang.org/x/crypto/ssh/agent code path is never imported or invoked (Go dead-code elimination drops unimported packages). Same present-but-unreachable basis as the libgnutls30/perl entries above. Remediation candidate when an upstream thruster release bumps golang.org/x/crypto>=0.52.0."
    nist_control: si-2
    reviewed_by: "@clem-field"
    discovery_date: "2026-06-04"
    next_review_date: "2026-08-19"

