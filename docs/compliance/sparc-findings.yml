    package: libcap2
    installed_version: "1:2.66-4+deb12u2+b2"
    fixed_version: "none"
    severity: HIGH
    disposition: remediated
    rationale: "REMEDIATED by the UBI9 base-image rotation (2026-07-17, v1.12.0, #742 / PR #746, commit 66da4810). libcap2 is a Debian bookworm package that does not exist in the shipped Red Hat UBI9 image (verified against v1.15.3, rpm -qa, 112 packages, no apt/dpkg). The vulnerable component is absent, not merely unreachable. Debian-era assessment retained for audit in sparc-findings.debian.yml and in git history; the original read: ACCEPTED RISK. TOCTOU race condition in libcap's cap_set_file() that allows a local unprivileged user with write access to a parent directory to redirect file capability updates. SPARC container runs as non-root UID 1000 with no Linux capabilities granted, no setcap operations performed at runtime, and no shared writable directories. Attack vector requires (a) local shell access with write permissions and (b) ability to invoke setcap on attacker-controlled paths -- neither exists in the container's runtime model. libcap2 is a transitive dependency of base-image utilities and is not invoked by the application. Remediation path: Debian Trixie upgrade or distroless base."
    nist_control: si-2
    reviewed_by: "@clem-field"
    discovery_date: "2026-07-11"
    next_review_date: "2026-08-28"

