- cve_id: CVE-2026-51302
  package: sqlite-libs
  installed_version: 3.34.1-9.el9_7
  fixed_version: 'none (Red Hat: Affected, no erratum)'
  severity: CRITICAL
  disposition: deferred
  rationale: 'RISK ADJUSTMENT. Use-after-free in SQLite expression evaluation (sqlite3ReleaseTempReg /
    exprComputeOperands); Red Hat rates this Critical, CVSS 10.0. The finding is CORRECT — sqlite-libs
    3.34.1-9.el9_7 is present at the affected version. SPARC is not exploitable: /usr/local/bin/ruby is
    not linked against libsqlite3 (verified by ldd on the shipped image), no package in the image requires
    sqlite-libs, and the only binaries linking libsqlite3.so.0 are gpg/gpg2 and the rpm/microdnf family
    backing the RPM database — none of which process untrusted input at runtime. There is no sqlite3 gem
    in Gemfile or Gemfile.lock and SPARC''s data path is PostgreSQL, so no attacker-controlled SQL or
    JSON reaches a SQLite parser. Red Hat lists RHEL 9 as Affected with no erratum, so there is nothing
    to patch to. Mitigating factors are recorded as structured data on the deviation for OSCAL risk/mitigating-factor
    export. Not KEV-listed as of the 2026.07.27 catalogue.'
