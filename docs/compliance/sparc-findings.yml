  package: curl-minimal/libcurl-minimal
  installed_version: 7.76.1-40.el9_8.5
  fixed_version: none
  severity: HIGH
  disposition: deferred
  rationale: 'POA&M / DEFERRED 2026-08-20 (14 days) — first dispositioned in #1001. libcurl fails to clear
    proxy authentication state when a handle is reused for sequential transfers under environment-variable
    proxy configuration, so a Proxy-Authorization header authenticated against one proxy can be sent to
    another. SPARC sets no proxy environment variables in the image and performs no libcurl transfers.
