  - cve_id: CVE-2026-41316
    package: erb (base-image-bundled stdlib, version 4.0.4)
    installed_version: "4.0.4 (default gem) / 6.0.6 (bundled, loaded)"
    fixed_version: ">= 6.0.4 (or backport 4.0.4.1)"
    severity: HIGH
    disposition: deferred
    rationale: "FALSE POSITIVE (default-gem shadow). ERB instance variable @_init guard bypass via Marshal.load of crafted ERB objects. The Gemfile now explicitly pins erb >= 6.0.4 (#620, same override pattern as the resolv CVE-2025-24294 pin), so Bundler installs and activates the patched 6.0.4 into /usr/local/bundle. ruby:3.4.4-slim still ships erb 4.0.4 as a default gem in specifications/default/, which the filesystem scanner reports — but Bundler activates 6.0.4, so `require \"erb\"` never loads the vulnerable 4.0.4 code. The flagged file is present-but-not-loaded (same basis as the libgnutls30/perl entries). Remediation candidate: drop the default-gem file on a distroless/base migration. Re-verified on the v1.15.3 image 2026-07-29 (#862): erb 4.0.4 remains as a Ruby default gem, but Bundler resolves erb 6.0.6, above the >= 6.0.4 fix floor."
    nist_control: si-2
