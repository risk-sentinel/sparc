  - cve_id: CVE-2026-42246
    package: net-imap (base-image-bundled stdlib, version 0.5.8)
    installed_version: "0.6.6 (bundled; 0.5.8 removed from the image)"
    fixed_version: ">= 0.6.4"
    severity: HIGH
    disposition: remediated
    rationale: "REMEDIATED by the shadowed-gem prune (#862): bin/prune-shadowed-gems.rb, invoked from the runtime stage of the Dockerfile, deletes Ruby-shipped bundled gems that the application bundle already shadows at an equal-or-newer version. net-imap 0.5.8 -- the copy this finding was raised against -- is removed from the image entirely; only the bundled net-imap 0.6.6 remains, above the >= 0.6.4 fix floor. Verified on a build of this branch: no net-imap 0.5.8 path anywhere on the filesystem, bundle check passes, a bundle exec require of net/imap resolves 0.6.6, and a Grype rescan of the built image clears all eight net-imap advisories that the published v1.15.3 image reported. Previously false_positive on the grounds that the vulnerable copy was present but never loaded; that copy no longer exists, so remediation is the correct disposition. Prior assessment: FALSE POSITIVE (default-gem shadow). Net::IMAP STARTTLS-stripping MITM. The Gemfile now explicitly pins net-imap >= 0.6.4 (#620, resolv-style override); Bundler activates the patched 0.6.4.x from /usr/local/bundle. ruby:3.4.4-slim ships net-imap 0.5.8 as a default gem, which the scanner reports, but it is never activated — and SPARC uses no Net::IMAP code path (no IMAP client / email retrieval) regardless. Present-but-not-loaded; see CVE-2026-42257/42258 (the CRITICAL siblings in the same net-imap 0.5.8 default gem). Remediation candidate: drop the default-gem file on a distroless/base migration. Re-verified on the v1.15.3 image 2026-07-29 (#862): net-imap 0.5.8 remains on disk as a Ruby-shipped gem; Bundler resolves 0.6.6, above the >= 0.6.4 fix floor."
    nist_control: si-2
    reviewed_by: "@clem-field"
    discovery_date: "2026-07-29"
    next_review_date: "2026-08-28"

