    database (v6.1.10 built 2026-11-02); the advisory reached the database after the v1.17.4 audit. The sqlite3
    shell is not installed in the image (no sqlite3 on PATH, no /usr/bin/sqlite3), so the vulnerable command
    is absent; only the library is. Deferred as a POA&M with a risk_adjustment deviation until Red Hat ships a
    fix, which the next image build then takes.'
