findings:
- cve_id: GHSA-q339-8rmv-2mhv
  package: erb
  installed_version: 4.0.4
  fixed_version: '>= 6.0.4 (or backport 4.0.4.1)'
  severity: HIGH
  disposition: deferred
  rationale: 'RE-KEYED 2026-08-20 (#1001) from CVE-2026-41316 to GHSA-q339-8rmv-2mhv, which is the id
    grype now reports for this same erb defect (it lists CVE-2026-41316 as a related vulnerability of
    GHSA-q339-8rmv-2mhv). NOT a new finding and NOT a cleared one: the audit''s first pass read CVE-2026-41316
    as absent from the scan and would have retired it with proof, which would have been a false remediation
    claim of exactly the kind this issue exists to stop. discovery_date is preserved — the exposure is
    continuous, only the label moved. RISK ADJUSTMENT. The vulnerable erb 4.0.4 (Ruby default gem) tree
    is present on disk but never loaded: Bundler resolves erb 6.0.6 from /usr/local/bundle, which is above
    the fix floor. The shipped copy is a Ruby default gem whose code is the standard library, so it cannot
    be pruned without falsifying the scan — deleting only the gemspec would hide the package while leaving
    the code in place. Risk is adjusted rather than accepted because the vulnerable code path is unreachable,
    not because the finding is wrong. Re-verified on the shipped image 2026-07-29 (#862). Package/version
    normalised to what the scan reports (erb 4.0.4, the Ruby DEFAULT gem left on disk deliberately by
    bin/prune-shadowed-gems.rb; the bundle resolves and loads erb 6.0.6). SEVERITY HIGH -> HIGH to match
    grype''s grading of GHSA-q339-8rmv-2mhv.'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-07-29'
  next_review_date: '2026-08-28'
  deviation:
    type: risk_adjustment
    risk_status: deviation-approved
    approved_by: '@clem-field'
    approved_in: risk-sentinel/sparc#866
    approved_at: '2026-07-30T12:38:25Z'
    approval_mechanism: admin-merge-bypass
    adjusted_severity: LOW
    mitigating_factors:
    - description: 'erb 4.0.4 (Ruby default gem) is present on disk but shadowed: Bundler resolves erb
        6.0.6 from /usr/local/bundle'
    - description: the vulnerable copy is never added to $LOAD_PATH and is not loaded at runtime
    - description: 'verified on the shipped v1.15.3 image and re-verified after the #862 shadowed-gem
        prune'
    kev_checked: '2026-07-29'
    kev_listed: false
  also_known_as: CVE-2026-41316
