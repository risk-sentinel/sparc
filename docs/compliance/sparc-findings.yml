- cve_id: CVE-2026-41316
  package: erb (base-image-bundled stdlib, version 4.0.4)
  installed_version: 4.0.4 (default gem) / 6.0.6 (bundled, loaded)
  fixed_version: '>= 6.0.4 (or backport 4.0.4.1)'
  severity: HIGH
  disposition: deferred
  rationale: 'RISK ADJUSTMENT. The vulnerable erb 4.0.4 (Ruby default gem) tree is present on disk but
    never loaded: Bundler resolves erb 6.0.6 from /usr/local/bundle, which is above the fix floor. The
    shipped copy is a Ruby default gem whose code is the standard library, so it cannot be pruned without
    falsifying the scan — deleting only the gemspec would hide the package while leaving the code in place.
    Risk is adjusted rather than accepted because the vulnerable code path is unreachable, not because
    the finding is wrong. Re-verified on the shipped image 2026-07-29 (#862).'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-07-29'
  next_review_date: '2026-08-28'
  deviation:
    type: risk_adjustment
    risk_status: deviation-approved
    approved_by: '@clem-field'
    approved_in: risk-sentinel/sparc#866
    approved_at: '2026-07-30T12:38:25Z'
    approval_mechanism: admin-merge-bypass
    adjusted_severity: LOW
    mitigating_factors:
    - description: 'erb 4.0.4 (Ruby default gem) is present on disk but shadowed: Bundler resolves erb
        6.0.6 from /usr/local/bundle'
    - description: the vulnerable copy is never added to $LOAD_PATH and is not loaded at runtime
    - description: 'verified on the shipped v1.15.3 image and re-verified after the #862 shadowed-gem
        prune'
    kev_checked: '2026-07-29'
    kev_listed: false
