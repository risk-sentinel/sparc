  severity: HIGH
  disposition: false_positive
  rationale: 'NOT A VULNERABILITY — all five results are NAME matches on values that are not secrets, traced
    to source. (1)+(2) models/user.rb `self.password =` / `self.password_confirmation =` — has_secure_password
    attributes; what is stored is the bcrypt `password_digest`, never the value. (3) models/user.rb
