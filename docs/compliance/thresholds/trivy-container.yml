# Trivy container image scan — the GATING container signal.
#
# Source: trivy-container-results.sarif, i.e. `trivy image --severity
# CRITICAL,HIGH`, which applies Trivy's own vendor-preferred severity.
#
# This is deliberately NOT the CycloneDX SBOM (see trivy-container-sbom.yml and
# #1064). For the same image on the same run, the two disagree completely:
# the SARIF reports 4 critical/high findings, the SBOM path reports 28, because
# `cyclonedx_sbom2hdf` takes the maximum rating across up to seven sources and
# so promotes Red Hat "low"/"medium" ratings to NVD "critical" on a Red Hat
# image. 45 of 74 findings differed. Red Hat's rating is the one that describes
# a UBI9 image.
#
# MEASURED 0, and the band is ratcheted to match (#1065, 2026-08-28).
#
# History, because the number moving to 0 is the whole point of #1065:
#
#   main@daf41392   4 requirement(s): failed=2 notApplicable=2 (amended)
#   PR #1078        1 requirement(s): failed=0        <- canary only
#
# The four were all shadowed Ruby default gems — the vulnerable Ruby-shipped
# copy sitting on disk while Bundler loaded a patched one:
#
#   CVE-2026-27820  zlib    3.2.1 on disk
#   CVE-2026-41316  erb     4.0.4 on disk
#   CVE-2025-24294  resolv  0.6.0 on disk
#   CVE-2025-61594  uri     1.0.3 on disk
#
# They are gone because **Ruby itself moved**, 3.4.4 -> 3.4.10, which ships
# zlib 3.2.3, erb 4.0.4.1 (the upstream backport), resolv 0.7.1 and uri 1.0.4 —
# every one at or above the version its advisory patches at. The vulnerable code
# is no longer in the image. Nothing was dispositioned to achieve this, so the
# owner decision of 2026-08-24 (record the honest residual rather than write a
# disposition to make the number look clean) is satisfied rather than bypassed.
#
# Note the two readings that made `uri` look unfixable for a while: our Gemfile
# pins `>= 1.1.1`, but the ADVISORY patches at `>= 1.0.4`. Read the advisory,
# not the pin, when deciding whether an upstream release closes a finding.
#
# RATCHET: high may only ever go DOWN. It is now 0, so ANY new critical/high
# against the image fails this gate. That is the intent. Do NOT raise it to
# accommodate a new finding — a raise means the band is being used to hide
# something. Fix the finding, or take a disposition through the register with a
# real approval.
#
# 2026-09-03 — CVE-2026-80212/-80213 put a HIGH back on `resolv 0.7.1`, the very
# version that closed the four above. There was no Ruby to move to this time, so
# the band was NOT raised and nothing was dispositioned: bin/prune-shadowed-gems.rb
# gained a measured allowlist and now removes the shadowed DEFAULT copy, gemspec
# and code together, because the Gemfile's `resolv >= 0.7.2` pin means Bundler
# already loads a complete replacement. The residual is 0 because the vulnerable
# code left the image — the same standard #1065 was held to.
#
# ONE KNOWN RESIDUAL, deliberately not gated here: `json`. Ruby 3.4.10 still
# ships json 2.9.1 on disk (CVE-2026-54696, fixed upstream in 2.19.9). It does
# not appear in this gate because the scan is `--severity CRITICAL,HIGH` and
# that CVE is CVSS 3.7 LOW. The Gemfile pins `json >= 2.19.9` so the LOADED copy
# is patched (2.21.2). If a future advisory raises its severity, this band will
# start failing — correctly, and that is the moment to act on the on-disk copy.
#
# AMENDMENTS NOW APPLY on this artifact (#1067). Earlier revisions of this file
# warned that no band could be justified by "these findings are dispositioned",
# because `hdf amend apply` matched `baselines[].requirements[].id` (HDF v3)
# while SAF's converters emitted v2, so every override hit an early return and
# the command still exited 0. Since #1067 the gate converts to v3 first and
# evaluates with scripts/ci/hdf_threshold_v3.rb — main@daf41392 above shows
# `notApplicable=2 (amended)`, which is that working. Upstream: mitre/hdf-libs#248.
#
# CAVEAT — SARIF cannot express "critical" (measured, not assumed).
#
# SARIF 2.1.0's `level` enum is error/warning/note only, so `trivy image
# --format sarif` emits BOTH critical and high as `level: error`, and
# `sarif2hdf` maps every one of them to impact 0.7 — the HIGH bucket. Verified
# on the real artifact: CVE-2026-27820 is tagged CRITICAL by Trivy and arrives
# in the HDF at impact 0.7, identical to the three highs beside it.
#
# So `critical.max` below can never fire on this scanner, and everything lands
# in `high`. That is not a hole: the scan is `--severity CRITICAL,HIGH`, so any
# NEW finding of either severity pushes the count past the baseline and fails
# the gate. What is lost is the ability to hold criticals to a tighter band than
# highs — one bucket, one number.
#
# `critical.max: 0` is kept because it costs nothing and would start working if
# the conversion ever preserved severity. Do not read it as active policy.
failed:
  critical:
    max: 0   # inert on this scanner — see the CAVEAT above
  high:
    max: 0   # RATCHETED 2026-08-28 (#1065): 4 -> 0. Ruby 3.4.10 removed all four.
error:
  total:
    max: 0
