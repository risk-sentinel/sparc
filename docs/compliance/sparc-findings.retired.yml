- cve_id: CVE-2026-29111
  package: libsystemd0
  installed_version: 252.39-1~deb12u1
  fixed_version: none
  severity: HIGH
  disposition: remediated
  rationale: 'REMEDIATED by the UBI9 base-image rotation (2026-07-17, v1.12.0, #742 / PR #746, commit
    66da4810). libsystemd0 is a Debian bookworm package that does not exist in the shipped Red Hat UBI9
    image (verified against v1.15.3, rpm -qa, 112 packages, no apt/dpkg). The vulnerable component is
    absent, not merely unreachable. Debian-era assessment retained for audit in sparc-findings.debian.yml
    and in git history; the original read: FALSE POSITIVE. CVE requires systemd running as PID 1 receiving
    IPC API calls with spurious data. SPARC container runs Rails server as PID 1 (docker-entrypoint ->
    bin/rails server), not systemd. No D-Bus socket exists in the container, no systemd IPC calls in the
    codebase, no sd_bus/sd_notify/systemctl usage. libsystemd0 is a transitive dependency of the base
    image, never invoked. Attack vector is unreachable.'
  nist_control: si-2
  reviewed_by: '@clem-field'
