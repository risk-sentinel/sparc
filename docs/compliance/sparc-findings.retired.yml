- cve_id: CVE-2026-8927
  package: curl-minimal/libcurl-minimal
  installed_version: 7.76.1-40.el9_8.5
  fixed_version: none
  severity: HIGH
  disposition: remediated
  rationale: 'REMEDIATED 2026-08-20 (#1001). curl-minimal and libcurl-minimal were removed from the runtime
    image: nothing in it links libcurl except the package manager, and SPARC''s outbound fetches all go
    through Ruby''s Net::HTTP/open-uri. The vulnerable code is no longer present rather than no longer
    reachable. POA&M / DEFERRED 2026-08-20 (14 days) — first dispositioned in #1001. libcurl fails to
    clear proxy authentication state when a handle is reused for sequential transfers under environment-variable
    proxy configuration, so a Proxy-Authorization header authenticated against one proxy can be sent to
    another. SPARC sets no proxy environment variables in the image and performs no libcurl transfers.
    Same reasoning and same remedy as CVE-2026-8458: the package is inherited from ubi-minimal, nothing
    requires it, and removing it is the real fix — tracked in #1001 rather than assumed here.'
