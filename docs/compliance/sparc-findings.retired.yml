- cve_id: CVE-2026-42257
  package: net-imap (default gem 0.5.8; bundled 0.6.4.1)
  installed_version: 0.6.6 (bundled; 0.5.8 removed from the image)
  fixed_version: '>= 0.6.4'
  severity: CRITICAL
  disposition: remediated
  rationale: 'REMEDIATED by the shadowed-gem prune (#862): bin/prune-shadowed-gems.rb, invoked from the
    runtime stage of the Dockerfile, deletes Ruby-shipped bundled gems that the application bundle already
    shadows at an equal-or-newer version. net-imap 0.5.8 -- the copy this finding was raised against --
    is removed from the image entirely; only the bundled net-imap 0.6.6 remains, above the >= 0.6.4 fix
    floor. Verified on a build of this branch: no net-imap 0.5.8 path anywhere on the filesystem, bundle
    check passes, a bundle exec require of net/imap resolves 0.6.6, and a Grype rescan of the built image
    clears all eight net-imap advisories that the published v1.15.3 image reported. Previously false_positive
    on the grounds that the vulnerable copy was present but never loaded; that copy no longer exists,
    so remediation is the correct disposition. Prior assessment: FALSE POSITIVE (default-gem shadow).
    Net::IMAP response-parsing flaw. The Gemfile pins net-imap >= 0.6.4 (#620), so Bundler activates the
    patched 0.6.4.1 from /usr/local/bundle. ruby:3.4.4-slim''s net-imap 0.5.8 default gem is reported
    by the filesystem scanner but never activated; additionally SPARC uses no Net::IMAP code path (no
    IMAP client / email retrieval). Vulnerable code is not loaded. Re-verified on the v1.15.3 image 2026-07-29
    (#862): Bundler resolves net-imap 0.6.6 (>= 0.6.4 fix floor); the 0.5.8 tree is present but never
    loaded.'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-07-29'
  verified_absent_on: '2026-08-20'
  verified_by: grype 0.114.0 (image scan of sparc-ubi9-web:latest, RHEL 9.8)
