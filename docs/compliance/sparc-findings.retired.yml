- cve_id: CVE-2026-8458
  package: curl-minimal/libcurl-minimal
  installed_version: 7.76.1-40.el9_8.5
  fixed_version: none
  severity: HIGH
  disposition: remediated
  rationale: 'REMEDIATED 2026-08-20 (#1001). curl-minimal and libcurl-minimal were removed from the runtime
    image: nothing in it links libcurl except the package manager, and SPARC''s outbound fetches all go
    through Ruby''s Net::HTTP/open-uri. The vulnerable code is no longer present rather than no longer
    reachable. POA&M / DEFERRED 2026-08-20 (14 days) — first dispositioned in #1001. libcurl may reuse
    an authenticated connection for an unintended service when doing Negotiate-authenticated transfers,
    because the connection-pool match does not account for the service. SPARC configures no Negotiate/GSSAPI
    authentication anywhere and makes no outbound calls through libcurl — Ruby HTTP goes through net/http
    and OpenSSL. Deferred rather than called a false positive because the honest measurement is narrower
    than the claim would be: /usr/bin/curl IS present in the runtime image, contrary to the Dockerfile
    comment asserting it is not, so the code is there and merely unused. `rpm -q --whatrequires` reports
    NOTHING in the image requires curl-minimal or libcurl-minimal — they are inherited from ubi-minimal.
    Removing them would retire this and roughly fifteen more findings outright; that is raised in #1001
    and is a deliberate image change, not a disposition.'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-08-20'
