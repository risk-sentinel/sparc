    data path is PostgreSQL, so no attacker-controlled SQL or JSON reaches a SQLite parser. Red Hat lists
    RHEL 9 as Affected with no erratum, so there is nothing to patch to. Mitigating factors are recorded
    as structured data on the deviation for OSCAL risk/mitigating-factor export. Not KEV-listed as of
