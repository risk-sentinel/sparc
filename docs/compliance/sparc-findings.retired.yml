- cve_id: CVE-2025-69720
  package: libncursesw6
  installed_version: 6.4-4
  fixed_version: none
  severity: HIGH
  disposition: remediated
  rationale: 'REMEDIATED by the UBI9 base-image rotation (2026-07-17, v1.12.0, #742 / PR #746, commit
    66da4810). libncursesw6 is a Debian bookworm package that does not exist in the shipped Red Hat UBI9
    image (verified against v1.15.3, rpm -qa, 112 packages, no apt/dpkg). The vulnerable component is
    absent, not merely unreachable. Debian-era assessment retained for audit in sparc-findings.debian.yml
    and in git history; the original read: ACCEPTED RISK. Ruby readline extension links to libncursesw6
    at compile time. Removing ncurses may cause the Ruby binary to fail on startup. No interactive terminal
    attached in production -- ncurses code paths are not exercised. Cannot safely remove without recompiling
    Ruby. Remediation path: Debian Trixie upgrade.'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-07-11'
  verified_absent_on: '2026-08-20'
  verified_by: grype 0.114.0 (image scan of sparc-ubi9-web:latest, RHEL 9.8)
