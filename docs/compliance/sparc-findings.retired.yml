- cve_id: CVE-2026-33811
  package: thruster (Go binary, stdlib v1.26.2)
  installed_version: thruster 0.1.21 / Go stdlib v1.26.2
  fixed_version: '>= Go 1.26.3'
  severity: HIGH
  disposition: remediated
  rationale: 'REMEDIATED by the removal of the thruster gem (2026-06-14, #639 / PR #651, commit fc7e4d73),
    which dropped the Go binary that carried this stdlib CVE. Verified against the shipped v1.15.3 image
    on 2026-07-29 (#862): no thruster binary on PATH or anywhere on the filesystem, no thruster gem installed,
    thruster absent from Gemfile.lock, and bin/docker-entrypoint runs Puma directly. Fresh Trivy and Grype
    scans of that image report this CVE zero times and find no thruster artifact; the only Go binary remaining
    is /usr/local/bin/hdf (hdf-cli, tracked separately by #776). NOTE: this entry carried a discovery_date
    AFTER the gem was removed, which indicates it was re-imported from stale scan data during the v1.12.2
    reconciliation (#770/#777) rather than observed in a shipped image. Original assessment: ACCEPTED
    RISK. Go 1.26.2 stdlib CVE in the thruster precompiled binary (HTTP/2 reverse proxy in front of Puma,
    on the production request path). thruster 0.1.21 is the latest release (no upstream build on Go >=
    1.26.3 exists), so no bump remediates it yet. Mitigations: thruster sits behind ALB/nginx with TLS
    termination, trusts only AWS-issued certs, and serves a controlled static-asset/upstream set. Risk
    knowingly accepted with compensating controls; re-evaluate when basecamp/thruster ships on Go >= 1.26.3
    (or rebuild in-house).'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-07-11'
  verified_absent_on: '2026-08-20'
  verified_by: grype 0.114.0 (image scan of sparc-ubi9-web:latest, RHEL 9.8)
