- cve_id: CVE-2026-4878
  package: libcap2
  installed_version: 1:2.66-4+deb12u2+b2
  fixed_version: none
  severity: HIGH
  disposition: remediated
  rationale: 'REMEDIATED by the UBI9 base-image rotation (2026-07-17, v1.12.0, #742 / PR #746, commit
    66da4810). libcap2 is a Debian bookworm package that does not exist in the shipped Red Hat UBI9 image
    (verified against v1.15.3, rpm -qa, 112 packages, no apt/dpkg). The vulnerable component is absent,
    not merely unreachable. Debian-era assessment retained for audit in sparc-findings.debian.yml and
    in git history; the original read: ACCEPTED RISK. TOCTOU race condition in libcap''s cap_set_file()
    that allows a local unprivileged user with write access to a parent directory to redirect file capability
    updates. SPARC container runs as non-root UID 1000 with no Linux capabilities granted, no setcap operations
    performed at runtime, and no shared writable directories. Attack vector requires (a) local shell access
    with write permissions and (b) ability to invoke setcap on attacker-controlled paths -- neither exists
    in the container''s runtime model. libcap2 is a transitive dependency of base-image utilities and
    is not invoked by the application. Remediation path: Debian Trixie upgrade or distroless base.'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-07-11'
  verified_absent_on: '2026-08-20'
  verified_by: grype 0.114.0 (image scan of sparc-ubi9-web:latest, RHEL 9.8)
- cve_id: CVE-2026-42246
  package: net-imap (base-image-bundled stdlib, version 0.5.8)
  installed_version: 0.6.6 (bundled; 0.5.8 removed from the image)
  fixed_version: '>= 0.6.4'
  severity: HIGH
  disposition: remediated
  rationale: 'REMEDIATED by the shadowed-gem prune (#862): bin/prune-shadowed-gems.rb, invoked from the
    runtime stage of the Dockerfile, deletes Ruby-shipped bundled gems that the application bundle already
    shadows at an equal-or-newer version. net-imap 0.5.8 -- the copy this finding was raised against --
    is removed from the image entirely; only the bundled net-imap 0.6.6 remains, above the >= 0.6.4 fix
    floor. Verified on a build of this branch: no net-imap 0.5.8 path anywhere on the filesystem, bundle
    check passes, a bundle exec require of net/imap resolves 0.6.6, and a Grype rescan of the built image
    clears all eight net-imap advisories that the published v1.15.3 image reported. Previously false_positive
    on the grounds that the vulnerable copy was present but never loaded; that copy no longer exists,
    so remediation is the correct disposition. Prior assessment: FALSE POSITIVE (default-gem shadow).
    Net::IMAP STARTTLS-stripping MITM. The Gemfile now explicitly pins net-imap >= 0.6.4 (#620, resolv-style
    override); Bundler activates the patched 0.6.4.x from /usr/local/bundle. ruby:3.4.4-slim ships net-imap
    0.5.8 as a default gem, which the scanner reports, but it is never activated — and SPARC uses no Net::IMAP
    code path (no IMAP client / email retrieval) regardless. Present-but-not-loaded; see CVE-2026-42257/42258
    (the CRITICAL siblings in the same net-imap 0.5.8 default gem). Remediation candidate: drop the default-gem
    file on a distroless/base migration. Re-verified on the v1.15.3 image 2026-07-29 (#862): net-imap
    0.5.8 remains on disk as a Ruby-shipped gem; Bundler resolves 0.6.6, above the >= 0.6.4 fix floor.'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-07-29'
  verified_absent_on: '2026-08-20'
  verified_by: grype 0.114.0 (image scan of sparc-ubi9-web:latest, RHEL 9.8)
- cve_id: CVE-2026-32280
  package: thruster (Go binary, stdlib v1.26.1)
  installed_version: thruster 0.1.21 / Go stdlib v1.26.2
  fixed_version: '>= Go 1.26.2'
  severity: HIGH
  disposition: remediated
  rationale: 'REMEDIATED by the removal of the thruster gem (2026-06-14, #639 / PR #651, commit fc7e4d73),
    which dropped the Go binary that carried this stdlib CVE. Verified against the shipped v1.15.3 image
    on 2026-07-29 (#862): no thruster binary on PATH or anywhere on the filesystem, no thruster gem installed,
    thruster absent from Gemfile.lock, and bin/docker-entrypoint runs Puma directly. Fresh Trivy and Grype
    scans of that image report this CVE zero times and find no thruster artifact; the only Go binary remaining
    is /usr/local/bin/hdf (hdf-cli, tracked separately by #776). NOTE: this entry carried a discovery_date
    AFTER the gem was removed, which indicates it was re-imported from stale scan data during the v1.12.2
    reconciliation (#770/#777) rather than observed in a shipped image. Original assessment: DEFERRED
    to hdf-libs (#776). Go stdlib v1.26.1 CVE carried by the hdf-cli binary (mitre/hdf-libs 3.4.1, #764);
    fixed in Go 1.25.9/1.26.2. SPARC installs hdf-cli verbatim (SHA-256 verified) and cannot recompile
    it — remediation requires an upstream hdf-libs build on Go>=1.26.2. Prior remediated label referenced
    the removed thruster binary (#639) and is stale. hdf-cli runs as a short-lived subprocess on operator
    files, not a TLS server, so the crypto/x509/tls path is not reached. Tracked: #776.'
  nist_control: si-2
  reviewed_by: '@clem-field'
  discovery_date: '2026-07-20'
  verified_absent_on: '2026-08-20'
  verified_by: grype 0.114.0 (image scan of sparc-ubi9-web:latest, RHEL 9.8)
