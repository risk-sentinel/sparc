# Fast inner loop on the PROD image (#966).
#
# The dev stack used to be a second base OS entirely (Dockerfile_debian). That
# bought edit-and-go iteration and cost us #750: Debian's implicit LANG=C.UTF-8
# masked UBI9's missing locale, which 500'd every page in production. A
# different base for development is how a prod-only bug stays hidden until prod.
#
# This gets the same iteration speed on the SAME image production ships.
#
# WHAT IS MOUNTED, AND WHY NOT EVERYTHING
#
#   app/ lib/ db/   the code you actually edit
#
# NOT `.:/rails`, deliberately. The image carries PRECOMPILED assets in
# public/assets; mounting the host's public/ over them serves a directory that
# has never been compiled, and every page loses its CSS. Gems are unaffected
# either way — BUNDLE_PATH is /usr/local/bundle, outside /rails.
#
# RAILS_ENV stays `production`, so `config.enable_reloading = false` applies: a
# code change needs `docker compose restart web` (seconds), not a rebuild
# (minutes). That is the whole win.
#
# After editing app/assets/**, rebuild — Propshaft resolves digests from the
# compiled set, which lives in the image.
#
#
# LIVES AT THE REPO ROOT, deliberately. `include:` resolves a file's relative
# paths against THAT FILE's directory, while `-f` resolves them against the
# first compose file's directory. From dev/ubi9/ the two disagree: `./app`
# became dev/ubi9/app under include, Docker created an empty directory and
# mounted it OVER the real source, and the container died on
# "cannot load such file -- /rails/config/boot". At the root both forms agree.
#
# Usage:
#   docker compose up -d            # the default stack already includes this
services:
  web:
    volumes:
      - ./app:/rails/app:ro
      - ./lib:/rails/lib:ro
      - ./db:/rails/db:ro
      - ./dev/ubi9/zzz_local_storage.rb:/rails/config/initializers/zzz_local_storage.rb:ro
