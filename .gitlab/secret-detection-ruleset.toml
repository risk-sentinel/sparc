# GitLab Secret Detection ruleset (#gitleaks-false-positives).
#
# GitLab's Secret Detection runs gitleaks with GitLab's OWN default ruleset and
# does NOT read the repo's root .gitleaks.toml on its own — which is why it flags
# the throwaway DB test credentials (disposable local/CI Postgres stacks) that
# the GitHub scan's .gitleaks.toml already allowlists. This passthrough points
# GitLab's gitleaks at the SAME .gitleaks.toml, so both scanners share one
# source of truth for what is a known-safe test/example value.
#
# Belt-and-suspenders: the specific DB-credential lines also carry inline
# `# gitleaks:allow` comments, which gitleaks (and therefore GitLab Secret
# Detection) honors regardless of config — so forks/clones scanned by either
# tool stay clean even if this passthrough is not picked up.
#
# Docs: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
[secrets]
  description = "SPARC — reuse the repository .gitleaks.toml so GitLab and GitHub agree"

  [[secrets.passthrough]]
    type   = "file"
    target = "gitleaks.toml"
    value  = ".gitleaks.toml"
